; OPcache is already enabled by the base image; this only tunes it for
; production. Code and the config/route caches are baked into the image and
; regenerated at container start, so timestamp validation is unnecessary.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=32
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.enable_cli=0
