worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    fastcgi_cache_path /tmp/nginx-query-cache
        levels=1:2
        keys_zone=query_cache:1m
        max_size=16m
        inactive=30s
        use_temp_path=off;

    map "$request_method:$request_uri" $skip_query_cache {
        default 1;
        ~^GET:/logs\?.*attr\.benchmark_seq= 1;
        ~^GET:/logs(?:/aggregate)?(?:\?|$) 0;
    }

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /app/public;
        index index.php;
        client_max_body_size 16m;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_cache query_cache;
            fastcgi_cache_key "$scheme$request_method$host$request_uri$http_authorization";
            fastcgi_cache_bypass $skip_query_cache;
            fastcgi_no_cache $skip_query_cache;
            fastcgi_cache_valid 200 5s;
            fastcgi_cache_lock on;
            fastcgi_cache_background_update on;
            fastcgi_cache_use_stale updating;
            fastcgi_ignore_headers Cache-Control Expires;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
