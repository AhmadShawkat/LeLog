services:
  app:
    build:
      context: .
    environment:
      APP_NAME: LeLog
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "6432"
      DB_DIRECT_HOST: postgres
      DB_DIRECT_PORT: "5432"
      DB_DATABASE: lelog
      DB_USERNAME: lelog
      DB_PASSWORD: lelog
      DB_PERSISTENT: "true"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      CACHE_STORE: array
      LOGS_RETENTION_DAYS: "30"
      LOGS_RETENTION_INTERVAL_SECONDS: "60"
      LOGS_RETENTION_BATCH_SIZE: "10000"
      LOGS_RETENTION_MAX_BATCHES: "10"
      LOGS_DATABASE_WORKER_LIMIT: "4"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    cpus: 0.5
    mem_limit: 256m
    stop_grace_period: 35s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lelog
      POSTGRES_USER: lelog
      POSTGRES_PASSWORD: lelog
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - wal_buffers=64MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      - -c
      - autovacuum_naptime=15s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - autovacuum_vacuum_cost_delay=2ms
      - -c
      - fsync=on
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lelog -d lelog"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    cpus: 1.0
    mem_limit: 1g
    stop_grace_period: 30s

volumes:
  postgres-data:
