name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lelog_test
          POSTGRES_USER: lelog
          POSTGRES_PASSWORD: lelog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lelog -d lelog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist

      - run: composer validate --strict
      - run: composer quality

  fresh-container-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - run: bash .github/scripts/fresh-container-smoke.sh
